[package]
name = "typdoc"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
iced = { version = "0.14.0", features = ["advanced", "highlighter", "image", "svg"] }
iced_highlighter = "0.14.0"
indexmap = { version = "2.14.0", features = ["serde"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive", "serde_derive"] }
serde_json = "1.0.151"
typst = "0.15.1"
typst-as-lib = "0.16.0"
typst-iced-editor = "0.2.0"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
whoami = "2.1.3"
zip = "8.6.0"
