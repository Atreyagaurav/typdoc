[package]
name = "typdoc"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
comemo = "0.5.1"
csv = "1.4.0"
iced = { version="0.14.0", features = ["advanced", "highlighter", "image", "svg"] }
iced_core = "0.14.0"
iced_highlighter = "0.14.0"
iced_palace = "0.14.0"
iced_split = "0.1.0"
indexmap = { version = "2.14.0", features = ["serde"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive", "serde_derive"] }
serde_json = "1.0.151"
termcolor = "1.4.1"
typst = "0.15.1"
typst-as-lib = { version = "0.17.0", features = ["typst-kit-embed-fonts", "typst-kit-fonts"] }
typst-iced-editor = "0.2.0"
typst-kit = { version = "0.15.1", features = ["emit-diagnostics"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-svg = "0.15.1"
whoami = "2.1.3"
zip = "9.0.5"
